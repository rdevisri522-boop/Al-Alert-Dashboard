<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>System Status</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>AI Alert & Decision Dashboard</h1>
    <p>System Status</p>
</header>

<main>

    <section class="status-box">

        <h2>📊 System Status</h2>

        <table>

            <tr>
                <th>System</th>
                <th>Status</th>
                <th>Action</th>
            </tr>

            <tr>
                <td>Server</td>
                <td class="status-online">
                    Online
                </td>
                <td>Monitor</td>
            </tr>

            <tr>
                <td>Database</td>
                <td class="status-warning">
                    Warning
                </td>
                <td>Check Storage</td>
            </tr>

            <tr>
                <td>AI Engine</td>
                <td class="status-active">
                    Active
                </td>
                <td>Running</td>
            </tr>

        </table>

    </section>

</main>

<footer>
    © 2026 AI Alert & Decision Dashboard
</footer>

</body>
</html>
